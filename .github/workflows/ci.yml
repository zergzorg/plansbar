name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    # Package.swift uses Swift tools 6.0, which needs Xcode 16 or newer.
    # The app itself still targets macOS 14 through the package platforms.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
      - name: Report toolchain
        run: swift --version
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test
      - name: Verify public fixtures
        run: Scripts/verify-fixtures.sh
      - name: Verify README translations
        run: Scripts/check-i18n.sh
      - name: Build app bundle
        run: Scripts/build-app.sh
      - name: Audit public tree
        run: Scripts/verify-public-tree.sh
      - name: Verify signature
        run: codesign --verify --deep --strict build/PlansBar.app
