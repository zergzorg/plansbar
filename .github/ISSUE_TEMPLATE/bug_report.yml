name: Bug report
description: Report a reproducible PlansBar problem without publishing private plan data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve PlansBar. Replace repository names and paths with synthetic examples such as `sample-api` and `~/Code/sample-api`.
  - type: input
    id: version
    attributes:
      label: PlansBar version
      placeholder: 0.1.0 (build abc123)
    validations:
      required: true
  - type: dropdown
    id: repository_state
    attributes:
      label: Repository state
      options:
        - ready
        - missing_structure
        - invalid_plans
        - inaccessible
        - unknown
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include expected and actual behavior using synthetic names and redacted output.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Use a synthetic repository or the public fixtures when possible.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed private plan contents, real repository names, absolute personal paths, credentials, and unreviewed command output.
          required: true
